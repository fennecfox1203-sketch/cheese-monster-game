<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="치즈괴물">
<title>치즈괴물 잡기</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#7ccf6b;touch-action:none;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;touch-action:none}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,236,150,.94);z-index:5;text-align:center;padding:20px}
.hide{display:none!important}
h1{font-size:64px;margin:0 0 8px;color:#e08a00;text-shadow:3px 3px 0 #fff}
.rules{font-size:22px;line-height:1.5;background:#fff;border-radius:20px;padding:14px 26px;max-width:760px;text-align:left}
.btn{font-size:40px;font-weight:bold;padding:18px 60px;border:none;border-radius:40px;background:#ff7a2f;color:#fff;margin:14px;box-shadow:0 6px 0 #c4501a}
.tb{font-size:26px;padding:12px 26px;margin:6px;border-radius:20px;border:3px solid #e08a00;background:#fff}
.tb.on{background:#ffc93c}
#res{font-size:26px;line-height:1.6;background:#fff;border-radius:20px;padding:14px 30px}
#mute{position:fixed;top:8px;left:50%;transform:translateX(120px);z-index:4;font-size:30px;background:#fff8;border:none;border-radius:14px;padding:4px 10px}
</style></head><body>
<canvas id="c"></canvas>
<button id="mute">🔊</button>
<div id="start" class="ov">
<h1>🧀 치즈괴물 잡기 🧀</h1>
<div class="rules">
🧀 <b>아빠</b>와 <b>이안</b>은 노란 <b>치즈괴물</b>이에요!<br>
🏃 <b>이든</b>과 <b>엄마</b>는 도망가요!<br>
👉 치즈괴물한테 닿으면 나도 치즈괴물이 돼요.<br>
⚡ 치즈괴물은 <b>번개 버튼</b>으로 휙! 빨리 달릴 수 있어요.<br>
⏰ 시간이 끝날 때까지 살아남으면 도망친 사람이 이겨요!<br>
🕹️ 내 이름이 있는 구석의 동그라미를 손가락으로 움직여요.
</div>
<div style="margin-top:10px"><span style="font-size:24px">시간: </span>
<button class="tb" data-t="60">60초</button><button class="tb on" data-t="90">90초</button><button class="tb" data-t="120">120초</button></div>
<button class="btn" id="go">시작!</button>
</div>
<div id="end" class="ov hide"><h1 id="et"></h1><div id="res"></div><button class="btn" id="again">다시 하기</button></div>
<script>
(()=>{
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,DPR,T=90;
function rs(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0);layout()}
// arena in normalized coords 0..1
const OBS=[[.30,.25,.08,.14],[.62,.25,.08,.14],[.30,.62,.08,.14],[.62,.62,.08,.14],[.46,.44,.08,.12]];
const P=[
 {n:'아빠',c:'#3b7bff',m:true,k:['w','s','a','d'],dk:'q',corner:0,sx:.2,sy:.5},
 {n:'이안',c:'#ff4fa0',m:true,k:['arrowup','arrowdown','arrowleft','arrowright'],dk:'/',corner:1,sx:.8,sy:.5},
 {n:'이든',c:'#22b14c',m:false,k:['i','k','j','l'],dk:'u',corner:2,sx:.12,sy:.15},
 {n:'엄마',c:'#9b4dff',m:false,k:['t','g','f','h'],dk:'r',corner:3,sx:.88,sy:.85}];
let A={x:0,y:0,w:0,h:0},R=24,JR=70,sticks=[],state='start',tLeft=0,order=[],last=0,elapsed=0,parts=[],muted=false,ac=null;
function layout(){const m=Math.min(W,H);JR=Math.max(55,m*.09);R=Math.max(18,m*.03);
 A={x:JR*2.6,y:10,w:W-JR*5.2,h:H-20};
 // corners: 0 TL,1 TR,2 BL,3 BR
 sticks=[0,1,2,3].map(i=>{const cx=i%2?W-JR*1.3:JR*1.3,cy=i<2?JR*1.3+10:H-JR*1.3-10;
  return Object.assign(sticks[i]||{id:null,dx:0,dy:0,did:null},{cx,cy,bx:cx,by:i<2?cy+JR*1.9:cy-JR*1.9})});}
function obsR(o){return{x:A.x+o[0]*A.w,y:A.y+o[1]*A.h,w:o[2]*A.w,h:o[3]*A.h}}
// audio
function au(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state=='suspended')ac.resume()}
function tone(f1,f2,d,type='sine',v=.3){if(muted||!ac)return;const o=ac.createOscillator(),gn=ac.createGain(),t=ac.currentTime;o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gn);gn.connect(ac.destination);o.start(t);o.stop(t+d)}
function poof(){if(muted||!ac)return;const t=ac.currentTime,len=ac.sampleRate*.4,b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len)**2;const s=ac.createBufferSource(),f=ac.createBiquadFilter(),gn=ac.createGain();s.buffer=b;f.type='lowpass';f.frequency.setValueAtTime(1500,t);f.frequency.exponentialRampToValueAtTime(150,t+.4);gn.gain.value=.7;s.connect(f);f.connect(gn);gn.connect(ac.destination);s.start();tone(500,120,.35,'triangle',.25)}
document.getElementById('mute').onpointerdown=e=>{e.stopPropagation();muted=!muted;e.target.textContent=muted?'🔇':'🔊'};
// input
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.startsWith('Arrow')||e.key==' ')e.preventDefault()});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
function down(e){au();if(state!='play')return;e.preventDefault();
 for(const t of e.changedTouches||[e]){const id=t.identifier??t.pointerId,x=t.clientX,y=t.clientY;
  for(let i=0;i<4;i++){const s=sticks[i];
   if(P[i].m&&Math.hypot(x-s.bx,y-s.by)<JR*.8){dash(P[i]);s.did=id;break}
   if(s.id==null&&Math.hypot(x-s.cx,y-s.cy)<JR*1.8){s.id=id;mv(s,x,y);break}}}}
function mv(s,x,y){let dx=x-s.cx,dy=y-s.cy,l=Math.hypot(dx,dy);if(l>JR){dx*=JR/l;dy*=JR/l}s.dx=dx/JR;s.dy=dy/JR}
function move(e){e.preventDefault();for(const t of e.changedTouches||[e]){const id=t.identifier??t.pointerId;for(const s of sticks)if(s.id===id)mv(s,t.clientX,t.clientY)}}
function up(e){for(const t of e.changedTouches||[e]){const id=t.identifier??t.pointerId;for(const s of sticks){if(s.id===id){s.id=null;s.dx=s.dy=0}if(s.did===id)s.did=null}}}
if('ontouchstart' in window){cv.addEventListener('touchstart',down,{passive:false});cv.addEventListener('touchmove',move,{passive:false});cv.addEventListener('touchend',up);cv.addEventListener('touchcancel',up)}
else{cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);down(e)});cv.addEventListener('pointermove',e=>{if(e.buttons)move(e)});cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up)}
document.addEventListener('gesturestart',e=>e.preventDefault());document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
function dash(p){if(p.m&&p.dcd<=0&&p.inv<=0){p.dash=.45;p.dcd=3;tone(300,900,.2,'square',.12)}}
// game
function start(){au();layout();order=[];parts=[];tLeft=T;elapsed=0;
 P.forEach((p,i)=>{p.m=i<2;p.x=A.x+p.sx*A.w;p.y=A.y+p.sy*A.h;p.inv=0;p.dash=0;p.dcd=0;p.caught=null;p.wob=Math.random()*6;sticks[i].id=null;sticks[i].dx=sticks[i].dy=0});
 state='play';document.getElementById('start').classList.add('hide');document.getElementById('end').classList.add('hide');tone(400,800,.3,'triangle')}
document.querySelectorAll('.tb').forEach(b=>b.onpointerdown=e=>{document.querySelectorAll('.tb').forEach(x=>x.classList.remove('on'));b.classList.add('on');T=+b.dataset.t;au();tone(600,700,.1)});
document.getElementById('go').onclick=start;document.getElementById('again').onclick=()=>{state='start';document.getElementById('end').classList.add('hide');document.getElementById('start').classList.remove('hide')};
function finish(mw){state='end';const e=document.getElementById('end');e.classList.remove('hide');
 document.getElementById('et').textContent=mw?'🧀 치즈괴물 승리! 🧀':'🏃 도망 성공! 🎉';
 let h='';const sv=P.filter(p=>!p.m||p.caught==null&&p.sx==null);
 const run=P.filter(p=>p.caught===null&&!['아빠','이안'].includes(p.n));
 if(run.length)h+='🏆 살아남은 사람: <b>'+run.map(p=>p.n).join(', ')+'</b><br>';
 order.forEach((o,i)=>{h+=`${i+1}번째로 잡힘: <b>${o.p.n}</b> (${o.t.toFixed(1)}초, 잡은 사람: ${o.by})<br>`});
 h+='처음 치즈괴물: 아빠, 이안';document.getElementById('res').innerHTML=h;
 if(mw)tone(300,150,.6,'sawtooth',.15);else[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,f,.25,'triangle'),i*150))}
function collide(p){p.x=Math.max(A.x+R,Math.min(A.x+A.w-R,p.x));p.y=Math.max(A.y+R,Math.min(A.y+A.h-R,p.y));
 for(const o of OBS){const r=obsR(o),cx=Math.max(r.x,Math.min(r.x+r.w,p.x)),cy=Math.max(r.y,Math.min(r.y+r.h,p.y)),dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy);
  if(d<R){if(d>0){p.x=cx+dx/d*R;p.y=cy+dy/d*R}else{p.y=r.y-R}}}}
function update(dt){tLeft-=dt;elapsed+=dt;const base=Math.min(W,H)*.32;
 P.forEach((p,i)=>{const s=sticks[i];let dx=s.dx,dy=s.dy;
  if(keys[p.k[0]])dy=-1;if(keys[p.k[1]])dy=1;if(keys[p.k[2]])dx=-1;if(keys[p.k[3]])dx=1;if(keys[p.dk])dash(p);
  const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}
  p.inv-=dt;p.dash-=dt;p.dcd-=dt;
  let sp=base*(p.m?0.92:1.0);if(p.dash>0)sp*=1.9;if(p.inv>0)sp*=.6;
  p.x+=dx*sp*dt;p.y+=dy*sp*dt;if(l>.1)p.face=dx<0?-1:dx>0?1:p.face||1;p.mov=l;collide(p)});
 for(const m of P)if(m.m&&m.inv<=0)for(const r of P)if(!r.m&&Math.hypot(m.x-r.x,m.y-r.y)<R*1.8){
  r.m=true;r.inv=2;r.caught=elapsed;order.push({p:r,t:elapsed,by:m.n});poof();
  for(let k=0;k<26;k++){const a=Math.random()*7;parts.push({x:r.x,y:r.y,vx:Math.cos(a)*200*Math.random(),vy:Math.sin(a)*200*Math.random(),l:.8})}}
 parts.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt});parts=parts.filter(q=>q.l>0);
 if(P.every(p=>p.m))finish(true);else if(tLeft<=0)finish(false)}
function rr(x,y,w,h,r){g.beginPath();g.roundRect?g.roundRect(x,y,w,h,r):g.rect(x,y,w,h)}
function draw(){g.fillStyle='#7ccf6b';g.fillRect(0,0,W,H);
 g.fillStyle='#a8e08f';rr(A.x,A.y,A.w,A.h,24);g.fill();g.strokeStyle='#4f9c41';g.lineWidth=5;g.stroke();
 for(const o of OBS){const r=obsR(o);g.fillStyle='#b5793c';rr(r.x,r.y,r.w,r.h,14);g.fill();g.fillStyle='#d9a066';rr(r.x+5,r.y+5,r.w-10,r.h-14,10);g.fill();g.font=Math.min(r.w,r.h)*.5+'px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('🌳',r.x+r.w/2,r.y+r.h/2)}
 const now=performance.now()/1000;
 P.forEach(p=>{if(p.x==null)return;const bob=Math.sin(now*12+p.wob)*3*(p.mov||0);
  g.save();g.translate(p.x,p.y+bob);if(p.inv>0&&Math.floor(now*10)%2)g.globalAlpha=.4;
  g.fillStyle='rgba(0,0,0,.2)';g.beginPath();g.ellipse(0,R*.9-bob,R*.9,R*.3,0,0,7);g.fill();
  if(p.m){ // cheese wedge
   g.fillStyle='#ffd23f';g.strokeStyle='#e0a200';g.lineWidth=3;g.beginPath();g.moveTo(-R*1.1,R*.8);g.lineTo(R*1.1,R*.8);g.lineTo(R*1.1,-R*.4);g.lineTo(-R*.9,-R*1);g.closePath();g.fill();g.stroke();
   g.fillStyle='#f0b400';[[-.5,.3,.2],[.5,.45,.15],[.6,-.1,.12],[-.1,-.4,.13]].forEach(h=>{g.beginPath();g.arc(h[0]*R,h[1]*R,h[2]*R,0,7);g.fill()});
   if(p.dash>0){g.font=R+'px sans-serif';g.textAlign='center';g.fillText('💨',-R*1.4*(p.face||1),0)}
   g.fillStyle='#fff';g.beginPath();g.arc(-R*.35,-R*.15,R*.25,0,7);g.arc(R*.35,-R*.15,R*.25,0,7);g.fill();g.fillStyle='#000';g.beginPath();g.arc(-R*.3,-R*.1,R*.12,0,7);g.arc(R*.4,-R*.1,R*.12,0,7);g.fill();
   g.fillStyle='#c0392b';g.beginPath();g.arc(0,R*.35,R*.25,0,3.14);g.fill();
  }else{g.fillStyle=p.c;g.beginPath();g.arc(0,0,R,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=3;g.stroke();
   g.font=R*1.3+'px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('😆',0,2)}
  g.globalAlpha=1;g.font='bold '+R*.75+'px sans-serif';g.textAlign='center';g.textBaseline='middle';g.lineWidth=4;g.strokeStyle='#fff';
  g.strokeText(p.n,0,-R*1.6);g.fillStyle=p.c;g.fillText(p.n,0,-R*1.6);g.restore()});
 parts.forEach(q=>{g.globalAlpha=Math.max(0,q.l);g.fillStyle='#ffe066';g.beginPath();g.arc(q.x,q.y,8*q.l+3,0,7);g.fill()});g.globalAlpha=1;
 // sticks
 sticks.forEach((s,i)=>{const p=P[i];g.fillStyle=p.c+'40';g.strokeStyle=p.c;g.lineWidth=4;g.beginPath();g.arc(s.cx,s.cy,JR,0,7);g.fill();g.stroke();
  g.fillStyle=p.m?'#ffd23f':p.c;g.beginPath();g.arc(s.cx+s.dx*JR*.7,s.cy+s.dy*JR*.7,JR*.45,0,7);g.fill();g.stroke();
  g.fillStyle='#fff';g.font='bold '+JR*.3+'px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(p.n,s.cx+s.dx*JR*.7,s.cy+s.dy*JR*.7);
  g.font=JR*.25+'px sans-serif';g.fillStyle='#000';g.fillText(p.m?'🧀 치즈괴물':'🏃 도망',s.cx,i<2?s.cy-JR-14+JR*2.05+ (p.m?JR*1.15:0)*0:s.cy+JR+14);
  if(p.m){const rdy=p.dcd<=0&&p.inv<=0;g.fillStyle=rdy?'#ff7a2f':'#bbb';g.beginPath();g.arc(s.bx,s.by,JR*.6,0,7);g.fill();g.strokeStyle='#fff';g.stroke();
   g.font=JR*.5+'px sans-serif';g.fillText('⚡',s.bx,s.by+2);
   if(!rdy&&p.dcd>0){g.fillStyle='#fff';g.font='bold '+JR*.3+'px sans-serif';g.fillText(Math.ceil(p.dcd),s.bx+JR*.45,s.by-JR*.4)}}});
 g.fillStyle='#fff';rr(W/2-90,8,180,50,25);g.fill();g.fillStyle=tLeft<10?'#e33':'#333';g.font='bold 34px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('⏰ '+Math.max(0,Math.ceil(tLeft)),W/2,34)}
function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if(state=='play')update(dt);draw();requestAnimationFrame(loop)}
addEventListener('resize',rs);rs();P.forEach(p=>{p.x=A.x+p.sx*A.w;p.y=A.y+p.sy*A.h;p.inv=p.dash=p.dcd=0});requestAnimationFrame(loop);
window.__start=start;window.__P=P;
})();
</script></body></html>
